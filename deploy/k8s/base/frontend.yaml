# The storefront: the built React bundle served by nginx, which also reverse
# proxies the API.
#
# This is the only workload in the cluster with an Ingress, and therefore the
# only one reachable from the internet. Everything else is ClusterIP. The
# proxy routes are an allowlist (see frontend/nginx.conf.template): there is
# no route to the payment service, and no route to the OTLP collector.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voltmart-frontend
  namespace: voltmart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: voltmart
  # No AWS permissions. nginx serves files and proxies HTTP; it has no reason
  # to hold credentials for anything.
---
apiVersion: v1
kind: Service
metadata:
  name: voltmart-frontend
  namespace: voltmart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: voltmart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: voltmart
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmart-frontend
  namespace: voltmart
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: voltmart
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: voltmart
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: voltmart
    spec:
      serviceAccountName: voltmart-frontend
      terminationGracePeriodSeconds: 30
      securityContext:
        # uid 101 is the `nginx` user in the nginx:alpine image.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: frontend }
      containers:
        - name: frontend
          image: voltmart/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Upstreams for the proxy. Substituted into the nginx config at
            # container start, so re-pointing the frontend at a different
            # backend is a manifest edit rather than an image rebuild.
            #
            # These must be FULLY QUALIFIED. nginx's `resolver` directive does
            # not read the search domains from /etc/resolv.conf, so a short
            # name like `voltmart-catalog` is queried literally and comes back
            # NXDOMAIN — every API route then returns 502 while the backends
            # are perfectly healthy.
            #
            # It is a confusing failure to chase, because anything else in the
            # same pod resolves the short name fine: `wget http://voltmart-catalog:8080`
            # works, since wget uses the system resolver and nginx does not.
            - name: CATALOG_UPSTREAM
              value: http://voltmart-catalog.voltmart.svc.cluster.local:8080
            - name: INVENTORY_UPSTREAM
              value: http://voltmart-inventory.voltmart.svc.cluster.local:8080
            - name: CART_UPSTREAM
              value: http://voltmart-cart.voltmart.svc.cluster.local:8080
            - name: ORDERS_UPSTREAM
              value: http://voltmart-orders.voltmart.svc.cluster.local:8080
            - name: CHECKOUT_UPSTREAM
              value: http://voltmart-checkout.voltmart.svc.cluster.local:8080
            - name: AGENT_UPSTREAM
              value: http://voltmart-support-agent.voltmart.svc.cluster.local:8080
            # Cluster DNS, so nginx resolves upstreams per request instead of
            # refusing to start when a backend Service does not exist yet.
            # Patched by the deploy script from the cluster's actual kube-dns
            # ClusterIP.
            - name: NGINX_RESOLVER
              value: "172.20.0.10"
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            failureThreshold: 15
            periodSeconds: 2
          livenessProbe:
            # Answered by nginx itself, never by a backend: a backend outage
            # must not restart the web tier.
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # nginx writes its rendered config, pid file and proxy buffers at
            # runtime, so these paths are writable while the image itself
            # stays read-only.
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: nginx-conf
          emptyDir: { sizeLimit: 1Mi }
        - name: nginx-cache
          emptyDir: { sizeLimit: 64Mi }
        - name: nginx-run
          emptyDir: { sizeLimit: 1Mi }
        - name: tmp
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: voltmart-frontend
  namespace: voltmart
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: voltmart
