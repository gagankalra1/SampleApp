# The six VoltMart business services.
#
# They are grouped in one file because they are structurally identical: same
# base image recipe, same probes, same security context, same telemetry
# configuration. The things that differ are called out per service.
#
# Every Service here is ClusterIP. None of them has an Ingress. The only way
# in from outside the cluster is through the frontend pod's nginx, which
# proxies a deliberate allowlist of paths — and does not proxy the payment
# service at all.
#
# Each Deployment shares these properties:
#   * runs as uid 10001, non-root, read-only root filesystem, no capabilities
#   * liveness probe never touches a dependency (so a DynamoDB blip cannot
#     restart every pod and turn a partial outage into a total one)
#   * readiness probe does check dependencies (so a pod that cannot serve is
#     taken out of the Service)
#   * pod identity rather than static credentials for AWS access

# ===========================================================================
# Catalog — product data. Stateless: the catalog is a JSON file in the image,
# so this service needs no table and no AWS permissions at all.
# ===========================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voltmart-catalog
  namespace: voltmart
  labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
---
apiVersion: v1
kind: Service
metadata:
  name: voltmart-catalog
  namespace: voltmart
  labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
  ports: [{ name: http, port: 8080, targetPort: http, protocol: TCP }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmart-catalog
  namespace: voltmart
  labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: catalog, app.kubernetes.io/part-of: voltmart }
    spec:
      serviceAccountName: voltmart-catalog
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: catalog }
      containers:
        - name: catalog
          image: voltmart/catalog:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: voltmart-config }
          env:
            - name: OTEL_SERVICE_NAME
              value: voltmart-catalog
            # Overrides the namespace default: no table, nothing to persist.
            - name: STORAGE_BACKEND
              value: memory
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 384Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              # Give the Service endpoint removal time to propagate before the
              # process stops, so a rolling update does not drop in-flight
              # requests.
              exec: { command: ["sleep", "5"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }

# ===========================================================================
# Inventory — stock levels. The only service with a hard correctness
