# ===========================================================================
# Checkout — the saga orchestrator. Calls cart, inventory, orders and
# payment, and compensates in reverse when a step fails. Stateless: the saga
# lives for the duration of one request.
# ===========================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voltmart-checkout
  namespace: voltmart
  labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
---
apiVersion: v1
kind: Service
metadata:
  name: voltmart-checkout
  namespace: voltmart
  labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
  ports: [{ name: http, port: 8080, targetPort: http, protocol: TCP }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmart-checkout
  namespace: voltmart
  labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: checkout, app.kubernetes.io/part-of: voltmart }
    spec:
      serviceAccountName: voltmart-checkout
      # Longer than the others: a checkout in flight is holding an inventory
      # reservation and possibly an authorized payment. Let it finish.
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: checkout }
      containers:
        - name: checkout
          image: voltmart/checkout:latest
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: voltmart-config }
          env:
            - name: OTEL_SERVICE_NAME
              value: voltmart-checkout
            # Holds no state of its own.
            - name: STORAGE_BACKEND
              value: memory
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 384Mi }
          startupProbe:
            httpGet: { path: /health, port: http }
            failureThreshold: 20
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
