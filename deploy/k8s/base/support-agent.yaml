# The Strands support agent.
#
# Separated from the other services because its operational profile is
# genuinely different:
#
#   * It calls Amazon Bedrock, so it needs an IAM role (via Pod Identity) and
#     internet or VPC-endpoint egress to the Bedrock runtime.
#   * One request can take tens of seconds — the model may chain several tool
#     calls — so its probes and grace period are more patient.
#   * It is the expensive endpoint. Every call costs model tokens, which is
#     why both nginx and the service itself rate limit, and why replicas stay
#     low by default.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voltmart-support-agent
  namespace: voltmart
  labels:
    app.kubernetes.io/name: support-agent
    app.kubernetes.io/part-of: voltmart
  # CloudFormation binds this ServiceAccount, via an EKS Pod Identity
  # Association, to a role granting exactly two things: bedrock:InvokeModel
  # on the configured model, and read/write on the conversations table.
---
apiVersion: v1
kind: Service
metadata:
  name: voltmart-support-agent
  namespace: voltmart
  labels:
    app.kubernetes.io/name: support-agent
    app.kubernetes.io/part-of: voltmart
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: support-agent
    app.kubernetes.io/part-of: voltmart
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: voltmart-support-agent
  namespace: voltmart
  labels:
    app.kubernetes.io/name: support-agent
    app.kubernetes.io/part-of: voltmart
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: support-agent
      app.kubernetes.io/part-of: voltmart
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: support-agent
        app.kubernetes.io/part-of: voltmart
    spec:
      serviceAccountName: voltmart-support-agent
      # A conversation turn can run for a minute. Killing the pod mid-turn
      # would leave the customer with a spinner and no answer.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: support-agent }
      containers:
        - name: support-agent
          image: voltmart/support-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef: { name: voltmart-config }
          env:
            - name: OTEL_SERVICE_NAME
              value: voltmart-support-agent
            - name: TABLE_NAME
              valueFrom:
                configMapKeyRef: { name: voltmart-tables, key: CONVERSATIONS_TABLE }
            # Bedrock is not available in every region. Pointing the model
            # call at a specific region keeps the rest of the stack free to
            # live wherever the workshop runs.
            - name: BEDROCK_REGION
              valueFrom:
                configMapKeyRef: { name: voltmart-config, key: AWS_REGION }
            - name: K8S_POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: K8S_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - name: K8S_NODE_NAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          resources:
            requests:
              # Heavier than the other services: the Strands SDK, boto3 and
              # the OTel stack together need real headroom at import time.
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          startupProbe:
            httpGet: { path: /health, port: http }
            # Importing the agent framework and constructing the Bedrock
            # client takes noticeably longer than a plain FastAPI service.
            failureThreshold: 40
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            # /ready checks both DynamoDB and that a Bedrock client can be
            # constructed, so a model access problem shows up as an unready
            # pod rather than a stream of 500s to customers.
            httpGet: { path: /ready, port: http }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 4
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 128Mi }
