[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voltmart-common"
version = "1.0.0"
description = "Shared telemetry, storage and HTTP helpers for VoltMart microservices"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "boto3>=1.34,<2.0",
    "opentelemetry-api>=1.25,<2.0",
    "opentelemetry-sdk>=1.25,<2.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "opentelemetry-instrumentation-botocore>=0.46b0",
    "opentelemetry-instrumentation-logging>=0.46b0",
    "opentelemetry-propagator-aws-xray>=1.0,<2.0",
]

[tool.setuptools.packages.find]
include = ["voltmart_common*"]
